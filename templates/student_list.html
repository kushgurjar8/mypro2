{% extends "base.html" %}

{% block title %}Students{% endblock %}

{% block content %}
    <h1>Student List</h1>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Valid</th>
                <th>Image</th>
            </tr>
        </thead>
        <tbody>
            {% for i in students %}
            <tr>
                <td>{{ i.name }}</td>
                <td>{{ i.valid }}</td>
                <td><img src="{{ i.image.url }}" width="80"></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
