{% extends "base.html" %}

{% block title %}Students{% endblock %}

{% block content %}
    <h1>Student List</h1>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>City</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.name }}</td>
                <td>{{ student.age }}</td>
                <td>{{ student.city }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
